<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar Nominal - ARDZ STORE</title>

<link rel="stylesheet" href="style.css">

<style>
body{
    background:#0f172a;
    color:white;
    font-family:Arial,sans-serif;
    padding:30px;
}

h1{
    text-align:center;
    margin-bottom:30px;
}

#listNominal{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    background:#1e293b;
    border-radius:15px;
    padding:20px;
    box-shadow:0 5px 15px rgba(0,0,0,.4);
}

.card h3{
    margin-bottom:10px;
    color:#00d4ff;
}

.card p{
    margin-bottom:15px;
}

button{
    padding:10px 18px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    margin-right:10px;
}

.edit{
    background:#f59e0b;
    color:white;
}

.hapus{
    background:#ef4444;
    color:white;
}

.kembali{
    display:inline-block;
    margin-top:30px;
    background:#00d4ff;
    color:white;
    text-decoration:none;
    padding:12px 20px;
    border-radius:10px;
}
</style>

</head>
<body>

<h1>📋 Daftar Nominal</h1>

<div id="listNominal"></div>

<a href="dashboard.html" class="kembali">← Kembali ke Dashboard</a>

<script src="nominal.js"></script>

<script>
tampilNominal();
</script>

</body>
</html>
