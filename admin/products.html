<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kelola Produk - ARDZ STORE</title>

<link rel="stylesheet" href="style.css">

<style>
table{
width:100%;
border-collapse:collapse;
margin-top:20px;
background:#fff;
border-radius:10px;
overflow:hidden;
}

th,td{
padding:15px;
text-align:center;
border-bottom:1px solid #ddd;
}

th{
background:#0099ff;
color:#fff;
}

.btn{
padding:8px 15px;
border:none;
border-radius:6px;
cursor:pointer;
text-decoration:none;
}

.edit{
background:orange;
color:#fff;
}

.delete{
background:red;
color:#fff;
}

.add{
display:inline-block;
margin-bottom:20px;
background:#28a745;
color:#fff;
padding:10px 15px;
border-radius:6px;
text-decoration:none;
}
</style>

</head>

<body>

<div class="main">

<h1>Kelola Produk</h1>

<a href="add-product.html" class="add">
+ Tambah Produk
</a>

<table>

<thead>
<tr>
<th>No</th>
<th>Game</th>
<th>Harga</th>
<th>Status</th>
<th>Aksi</th>
</tr>
</thead>

<tbody id="product-list">
</tbody>

</table>

</div>

<script src="app.js"></script>

</body>
</html>
