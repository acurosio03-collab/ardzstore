<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kelola Produk - ARDZ STORE</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    margin:0;
}

.container{
    width:90%;
    margin:30px auto;
}

h1{
    color:#0099ff;
}

.add-btn{
    display:inline-block;
    background:#28a745;
    color:white;
    padding:12px 20px;
    text-decoration:none;
    border-radius:8px;
    margin-bottom:20px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

th{
    background:#0099ff;
    color:white;
    padding:15px;
}

td{
    padding:15px;
    text-align:center;
    border-bottom:1px solid #ddd;
}

button{
    border:none;
    padding:8px 15px;
    border-radius:5px;
    cursor:pointer;
}

.edit{
    background:orange;
    color:white;
}

.delete{
    background:red;
    color:white;
}

</style>

</head>

<body>

<div class="container">

<h1>Kelola Produk</h1>

<a class="add-btn" href="add-product.html">
+ Tambah Produk
</a>

<table>

<thead>

<tr>

<th>No</th>

<th>Nama Game</th>

<th>Harga</th>

<th>Status</th>

<th>Aksi</th>

</tr>

</thead>

<tbody id="product-list">

</tbody>

</table>

</div>

<script src="app.js"></script>

</body>
</html>
