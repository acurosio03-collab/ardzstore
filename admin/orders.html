<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kelola Pesanan - ARDZ STORE</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="admin-header">
    <h1>📦 Kelola Pesanan</h1>

    <a href="dashboard.html" class="btn-back">
        ⬅ Dashboard
    </a>
</header>

<div class="stats">

    <div class="stat-card">
        <h2 id="totalOrder">0</h2>
        <p>Total Pesanan</p>
    </div>

    <div class="stat-card waiting">
        <h2 id="waitingOrder">0</h2>
        <p>Menunggu</p>
    </div>

    <div class="stat-card process">
        <h2 id="processOrder">0</h2>
        <p>Diproses</p>
    </div>

    <div class="stat-card success">
        <h2 id="doneOrder">0</h2>
        <p>Selesai</p>
    </div>

</div>

<input
type="text"
id="searchOrder"
placeholder="🔍 Cari berdasarkan Game / User ID..."
onkeyup="cariOrder()">

<br><br>

<div id="ordersList"></div>

<script src="orders.js"></script>

</body>
</html>
