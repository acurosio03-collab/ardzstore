<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tambah Nominal</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Tambah Nominal</h1>

<form id="nominalForm">

<label>Game</label>
<select id="game" required>
<option value="">Pilih Game</option>
<option>Mobile Legends</option>
<option>Free Fire</option>
<option>PUBG Mobile</option>
<option>Roblox</option>
<option>Valorant</option>
<option>Honor Of Kings</option>
</select>

<br><br>

<label>Nama Produk</label>
<input type="text" id="produk" placeholder="Contoh : 86 Diamond" required>

<br><br>

<label>Harga Supplier</label>
<input type="number" id="supplier" required>

<br><br>

<label>Keuntungan</label>
<input type="number" id="profit" value="1000" required>

<br><br>

<button type="submit">
Simpan Nominal
</button>

</form>

<br>

<a href="list-nominal.html">
Lihat Daftar Nominal
</a>

<script src="nominal.js"></script>

</body>
</html>
