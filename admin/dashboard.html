<html lang="id">

<title>Dashboard Admin - ARDZ STORE</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#eef3ff;
display:flex;
}

.sidebar{
width:250px;
height:100vh;
background:#0f172a;
color:white;
position:fixed;
padding:20px;
}

.sidebar h2{
text-align:center;
color:#38bdf8;
margin-bottom:30px;
}

.sidebar a{
display:block;
padding:15px;
margin:10px 0;
text-decoration:none;
color:white;
border-radius:10px;
transition:.3s;
}

.sidebar a:hover{
background:#1e293b;
}

.main{
margin-left:250px;
width:100%;
padding:30px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

.header h1{
color:#0f172a;
}

.admin{
background:#0099ff;
padding:10px 20px;
border-radius:30px;
color:white;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

.card{
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.card h3{
color:#666;
margin-bottom:10px;
}

.card h2{
color:#0099ff;
}
