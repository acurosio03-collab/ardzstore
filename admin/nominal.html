<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Nominal - ARDZ STORE</title>

    <link rel="stylesheet" href="../theme.css">
    <link rel="stylesheet" href="../style.css">
</head>

<body>

<div class="admin-box">

    <h1>💎 Kelola Nominal Game</h1>

    <form id="nominalForm">

        <label>Game</label>
        <select id="game">
            <option>Mobile Legends</option>
            <option>Free Fire</option>
            <option>PUBG Mobile</option>
            <option>Roblox</option>
            <option>Valorant</option>
            <option>Honor Of Kings</option>
        </select>

        <label>Nama Nominal</label>
        <input type="text" id="produk" placeholder="Contoh : 86 Diamond">

        <label>Harga Supplier</label>
        <input type="number" id="supplier" placeholder="18000">

        <label>Margin Keuntungan</label>
        <input type="number" id="profit" placeholder="2000">

        <button type="submit">
            💾 Simpan Nominal
        </button>

    </form>

    <hr style="margin:30px 0;">

    <h2>Daftar Nominal</h2>

    <div id="listNominal"></div>

</div>

<script src="nominal.js"></script>

</body>
</html>
