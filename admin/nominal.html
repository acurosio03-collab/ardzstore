<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ARDZ STORE - Kelola Nominal</title>

<link rel="stylesheet" href="admin.css">

</head>


<body>


<!-- SIDEBAR -->

<div class="sidebar">

<div class="logo">
🎮 ARDZ STORE
</div>


<a href="dashboard.html">
🏠 Dashboard
</a>


<a class="active" href="nominal.html">
💎 Kelola Nominal
</a>


<a href="orders.html">
🛒 Pesanan
</a>


<a href="#">
💳 Pembayaran
</a>


<a href="#">
⚙ Pengaturan
</a>


<a href="../index.html">
🌍 Website
</a>


</div>



<!-- MAIN -->

<div class="main">


<h1 class="title">
💎 Kelola Nominal
</h1>



<div class="box">


<input 
type="text"
id="search"
placeholder="🔍 Cari produk..."
onkeyup="cariProduk()">



<select id="filterGame" onchange="filterGame()">

<option value="Semua">
Semua Game
</option>


<option value="Mobile Legends">
Mobile Legends
</option>


<option value="Free Fire">
Free Fire
</option>


<option value="PUBG Mobile">
PUBG Mobile
</option>


<option value="Valorant">
Valorant
</option>


<option value="Honor Of Kings">
Honor Of Kings
</option>


<option value="Roblox">
Roblox
</option>


</select>



<button class="btn-add"
onclick="bukaModal()">

➕ Tambah Produk

</button>


</div>




<!-- TABEL DATA -->

<div class="box">

<div id="tableNominal">

</div>


</div>



</div>





<!-- MODAL TAMBAH EDIT -->

<div id="modalNominal" class="modal">


<div class="modal-content">


<span class="close"
onclick="tutupModal()">

×
</span>



<h2 id="judulModal">

Tambah Nominal

</h2>



<input
id="game"
placeholder="Nama Game">


<input
id="produk"
placeholder="Nama Produk">


<input
id="supplier"
type="number"
placeholder="Harga Supplier">



<input
id="profit"
type="number"
placeholder="Profit">





<button class="btn-save"
onclick="simpanNominal()">

💾 Simpan

</button>



<button onclick="tutupModal()">

Batal

</button>



</div>


</div>






<script src="nominal.js"></script>


</body>

</html>
