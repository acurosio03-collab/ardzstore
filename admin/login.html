<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - ARDZ STORE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen px-4">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-2xl">
        <div class="text-center mb-8">
            <div class="inline-block bg-purple-600/20 text-purple-400 p-3 rounded-2xl text-2xl mb-3">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight">Admin Login</h1>
            <p class="text-slate-400 text-sm mt-1">Masuk untuk mengelola produk ARDZ STORE</p>
        </div>

        <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-2">Username</label>
                <input type="text" id="username" required placeholder="Masukkan username" class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-purple-500 text-sm">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-2">Password</label>
                <input type="password" id="password" required placeholder="Masukkan password" class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-purple-500 text-sm">
            </div>
            <button type="submit" class="w-full py-3.5 bg-purple-600 hover:bg-purple-500 font-semibold rounded-xl shadow-lg shadow-purple-600/30 transition-all text-sm">
                Masuk Dashboard
            </button>
            <div class="text-center mt-4">
                <a href="../index.html" class="text-xs text-slate-400 hover:text-purple-400 transition-colors">← Kembali ke Beranda</a>
            </div>
        </form>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            // Default login sederhana (bisa diganti sesuai keinginan)
            if (user === 'admin' && pass === 'ardzstore123') {
                localStorage.setItem('ardz_logged_in', 'true');
                window.location.href = 'dashboard.html';
            } else {
                alert('Username atau Password salah! (Default: admin / ardzstore123)');
            }
        }
    </script>
</body>
</html>
