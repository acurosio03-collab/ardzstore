<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Top Up Mobile Legends — ARDZ STORE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0F17;
    --bg-card:#141B27;
    --bg-card-hover:#1B2433;
    --ink:#F3F6FA;
    --ink-soft:#8B97A8;
    --violet:#8B5CF6;
    --violet-deep:#6D3FE0;
    --cyan:#33E6C4;
    --gold:#FFB020;
    --line: rgba(255,255,255,0.08);
    --radius:18px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 10% 0%, rgba(139,92,246,.16), transparent 45%),
      radial-gradient(circle at 90% 20%, rgba(51,230,196,.10), transparent 40%),
      var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    line-height:1.55;
  }
  h1,h2,h3{font-family:'Space Grotesk',sans-serif; margin:0; letter-spacing:-0.01em;}
  .mono{font-family:'Space Mono',monospace;}
  a{color:inherit;}
  .wrap{max-width:960px;margin:0 auto;padding:0 20px;}
  :focus-visible{outline:3px solid var(--cyan); outline-offset:2px;}

  header{
    position:sticky; top:0; z-index:40;
    background:rgba(11,15,23,0.85);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .nav{display:flex; align-items:center; justify-content:space-between; padding:16px 20px; max-width:960px; margin:0 auto;}
  .brand{display:flex; align-items:center; gap:10px; font-family:'Space Grotesk',sans-serif; font-weight:800;}
  .brand .dot{width:10px;height:10px;border-radius:99px; background:var(--cyan); box-shadow:0 0 0 4px rgba(51,230,196,.2);}
  .back-link{display:flex; align-items:center; gap:6px; font-size:.9rem; color:var(--ink-soft); text-decoration:none;}

  main{padding:36px 0 80px;}

  .product-head{display:flex; gap:18px; align-items:center; margin-bottom:32px;}
  .product-icon{
    width:64px; height:64px; border-radius:16px;
    background:linear-gradient(135deg,var(--violet),var(--violet-deep));
    display:flex; align-items:center; justify-content:center; font-size:1.8rem;
    flex-shrink:0;
  }
  .product-head h1{font-size:1.5rem; margin-bottom:4px;}
  .product-head p{margin:0; color:var(--ink-soft); font-size:.9rem;}

  .section-label{
    font-family:'Space Mono',monospace; font-size:.75rem; letter-spacing:.08em; text-transform:uppercase;
    color:var(--cyan); margin-bottom:14px; display:flex; align-items:center; gap:8px;
  }
  .section-label .n{
    width:20px; height:20px; border-radius:6px; background:var(--bg-card); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:.7rem; color:var(--ink);
  }

  /* nominal grid */
  .nominal-grid{
    display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:44px;
  }
  @media (max-width:640px){ .nominal-grid{grid-template-columns:repeat(2,1fr);} }
  .nominal-card{
    background:var(--bg-card); border:1.5px solid var(--line); border-radius:14px;
    padding:16px 14px; cursor:pointer; text-align:left;
    transition:all .15s ease; position:relative;
  }
  .nominal-card:hover{background:var(--bg-card-hover); border-color:rgba(139,92,246,.4);}
  .nominal-card.selected{
    border-color:var(--violet); background:rgba(139,92,246,.12);
    box-shadow:0 0 0 1px var(--violet);
  }
  .nominal-card .badge{
    position:absolute; top:-9px; right:10px;
    background:var(--gold); color:#3A2500; font-size:.65rem; font-weight:800;
    padding:3px 8px; border-radius:99px; font-family:'Space Grotesk',sans-serif;
  }
  .nominal-card .amount{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:1.02rem; margin-bottom:6px;}
  .nominal-card .price{font-family:'Space Mono',monospace; font-size:.88rem; color:var(--cyan);}

  /* ringkasan */
  .summary-bar{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--bg-card); border:1px solid var(--line); border-radius:14px;
    padding:16px 20px; margin-bottom:44px;
  }
  .summary-bar .lbl{font-size:.82rem; color:var(--ink-soft);}
  .summary-bar .val{font-family:'Space Mono',monospace; font-weight:700; font-size:1.3rem; color:var(--ink);}

  /* qris */
  .qris-box{
    background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius);
    padding:28px; display:grid; grid-template-columns:220px 1fr; gap:28px; align-items:center;
    margin-bottom:24px;
  }
  @media (max-width:640px){ .qris-box{grid-template-columns:1fr; text-align:center;} }
  .qris-box img{width:100%; border-radius:12px; border:1px solid var(--line);}
  .qris-steps{display:flex; flex-direction:column; gap:14px;}
  .qris-step{display:flex; gap:12px; align-items:flex-start;}
  .qris-step .num{
    width:26px; height:26px; border-radius:99px; background:var(--violet); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:.78rem; font-weight:700;
    flex-shrink:0; font-family:'Space Grotesk',sans-serif;
  }
  .qris-step p{margin:0; font-size:.9rem; color:var(--ink-soft);}
  .qris-step b{color:var(--ink);}

  .notice{
    background:rgba(255,176,32,.1); border:1px solid rgba(255,176,32,.35);
    border-radius:12px; padding:14px 16px; font-size:.85rem; color:#FFD187;
    margin-bottom:32px; display:flex; gap:10px;
  }

  .confirm-box{
    background:linear-gradient(135deg, rgba(139,92,246,.15), rgba(51,230,196,.08));
    border:1px solid rgba(139,92,246,.3); border-radius:var(--radius);
    padding:28px; text-align:center;
  }
  .confirm-box h2{font-size:1.2rem; margin-bottom:8px;}
  .confirm-box p{color:var(--ink-soft); font-size:.9rem; margin:0 0 22px; max-width:44ch; margin-left:auto; margin-right:auto;}
  .btn-wa{
    display:inline-flex; align-items:center; gap:10px;
    background:var(--violet); color:#fff; font-family:'Space Grotesk',sans-serif; font-weight:700;
    padding:15px 30px; border-radius:99px; text-decoration:none; font-size:1rem;
    box-shadow:0 10px 26px -10px rgba(139,92,246,.6);
    transition:transform .15s ease, background .15s ease;
    border:none; cursor:pointer;
  }
  .btn-wa:hover{transform:translateY(-2px); background:var(--violet-deep);}
  .btn-wa[disabled]{opacity:.4; cursor:not-allowed; transform:none;}
  .confirm-hint{font-size:.78rem; color:var(--ink-soft); margin-top:14px;}

  footer{border-top:1px solid var(--line); padding:26px 0; text-align:center; color:var(--ink-soft); font-size:.8rem;}
</style>
</head>
